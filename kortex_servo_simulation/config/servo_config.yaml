# Input/Output settings
command_in_type: "unitless"
scale:
  linear: 0.9
  rotational: 1.5
  joint: 1.0

command_out_type: "trajectory_msgs/JointTrajectory"
publish_period: 0.002
incoming_command_timeout: 0.1

# Publish configuration
publish_joint_positions: true
publish_joint_velocities: false
publish_joint_accelerations: false

# Smoothing Plugin (OBRIGATÓRIO NO HUMBLE - Substitui o low_pass_filter_coeff)
smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"

# Topics
command_out_topic: "/joint_trajectory_controller/joint_trajectory"
joint_topic: "/joint_states"
status_topic: "/servo_node/status"
cartesian_command_in_topic: "/servo_node/delta_twist_cmds"
joint_command_in_topic: "/servo_node/delta_joint_cmds" # Adicionei a '/' que faltava no seu original

# Frames
robot_link_command_frame: "base_link"
ee_frame_name: "tool_frame" # OBRIGATÓRIO NO HUMBLE. (Confirme se no Kinova Gen3 Lite é esse o nome no seu URDF, às vezes é "tool_frame")

# MoveIt properties
move_group_name: "arm" 
is_primary_planning_scene_monitor: false

# Collision checking (Padrão do Humble)
check_collisions: true
collision_check_rate: 10.0
collision_distance_safety_factor: 1000.0 # Multiplicador de margem de segurança
min_allowable_collision_distance: 0.01   # Distância mínima (metros) antes do robô travar

# Singularity configuration
lower_singularity_threshold: 50.0
hard_stop_singularity_threshold: 100.0
leaving_singularity_threshold_multiplier: 2.0

# Joint limit margins (SINGULAR E FLOAT no Humble)
joint_limit_margin: 0.1